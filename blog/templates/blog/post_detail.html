{% extends "blog/base.html" %}
{% block content %}
    <article class="media content-section">
      <img class="rounded-circle article-img" src="{{ object.author.profile.profile_picture.url }}">
      <div class="media-body">
        <div class="article-metadata">
          {# Specific-user list link: opens all posts written by this author. #}
          <a class="mr-2" href="{% url 'user-posts' object.author.username %}">{{ object.author }}</a>
          <small class="text-muted">{{ object.posted_at|date:"F d, Y" }}</small>
          {% if user == object.author %}
            <a class="btn btn-outline-secondary btn-sm ms-2" href="{% url 'post-update' object.pk %}">Edit</a>
            <a class="btn btn-outline-danger btn-sm ms-2" href="{% url 'post-delete' object.pk %}">Delete</a>
          {% endif %}
        </div>
        <h2 class="article-title">{{ object.title }}</h2>
        <p class="article-content">{{ object.content }}</p>
      </div>
    </article>
    {% endblock content %}
